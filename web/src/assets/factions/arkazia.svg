<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 112" role="img" aria-hidden="true">
  <!-- Arkazian faction placeholder: ground that has been surveyed and pegged out,
       but not yet built on. Used wherever a specific building asset is missing,
       so a fallback still reads as part of this site rather than as a hole.

       It shares the building grammar exactly — same frame, same ridge, same
       ground band — and shows only what the House has actually done here:
       cleared the footing, driven the stakes, set a line and left a flag. -->
  <defs><linearGradient id="akSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1A1815"/><stop offset="1" stop-color="#12100E"/></linearGradient></defs>
  <rect width="160" height="112" fill="url(#akSky)"/>

  <path d="M0 48 26 28l24 16 24-14 26 18 28-12 32 18v58H0Z" fill="#221D19"/>
  <path d="M0 68 34 56l28 10 26-8 30 12 42-8v42H0Z" fill="#2A2521"/>
  <path d="M6 88h148v4H6Z" fill="#2E2922"/>

  <!-- Cleared and levelled footing. -->
  <path d="M30 88 44 68h72l14 20Z" fill="#252119"/>
  <path d="M30 88 44 68h72l14 20Z" fill="none" stroke="#4A4239" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Set-out lines across the plot. -->
  <g stroke="#3E3831" stroke-width="1" stroke-dasharray="3 5" opacity="0.9">
    <path d="M40 78h80M62 68v20M98 68v20"/>
  </g>

  <!-- Corner stakes, driven and braced. -->
  <g stroke="#4A3A2C" stroke-width="3" stroke-linecap="round">
    <path d="M44 68V52M116 68V52M30 88V74M130 88V74"/>
  </g>
  <path d="M44 52h16v7H44Z" fill="#8E2A24"/>

  <!-- Levelling line between the two head stakes. -->
  <path d="M44 56h72" stroke="#5C5248" stroke-width="1" opacity="0.8"/>

  <!-- A pile of the first stone, dropped where it will be needed. -->
  <g fill="#3A342D"><rect x="126" y="80" width="14" height="8"/><rect x="132" y="72" width="10" height="8"/></g>
  <g fill="#4A4239"><rect x="126" y="80" width="14" height="1.5"/><rect x="132" y="72" width="10" height="1.5"/></g>

  <rect y="92" width="160" height="20" fill="#1A1815"/>
</svg>

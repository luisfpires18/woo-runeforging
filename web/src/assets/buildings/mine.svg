<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 112" role="img" aria-hidden="true">
  <!-- The Mine: a timbered adit driven into the iron-rich slope, with a headframe,
       an ore cart on its rails, and the spoil that came out of the shaft. -->
  <defs><linearGradient id="mnSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1A1815"/><stop offset="1" stop-color="#12100E"/></linearGradient></defs>
  <rect width="160" height="112" fill="url(#mnSky)"/>

  <!-- Ridge behind: steep and close, because the shaft goes straight into it. -->
  <path d="M0 34 26 12l30 26 22-16 30 28 26-14 26 22v54H0Z" fill="#221D19"/>
  <path d="M0 56 34 34l36 28 26-14 30 24 34-12v42H0Z" fill="#2A2521"/>

  <!-- The slope face the adit is cut into. -->
  <path d="M0 88V54l36-16 34 24 24-10 30 18 36-10v28Z" fill="#312C26"/>
  <path d="M0 54 36 38l34 24 24-10 30 18 36-10v6l-36 10-30-18-24 10-34-24L0 60Z" fill="#3A342D"/>

  <!-- The adit: timber portal, and dark that goes back a long way. -->
  <path d="M52 88V68a14 14 0 0 1 28 0v20Z" fill="#12100E"/>
  <path d="M50 68a16 16 0 0 1 32 0" fill="none" stroke="#4A3A2C" stroke-width="5"/>
  <rect x="48" y="68" width="6" height="20" fill="#4A3A2C"/>
  <rect x="78" y="68" width="6" height="20" fill="#4A3A2C"/>
  <rect x="46" y="64" width="40" height="5" fill="#3E3128"/>

  <!-- Headframe over the shaft, with its winding sheave. -->
  <path d="M100 88V52l16-14 16 14v50" fill="none" stroke="#4A3A2C" stroke-width="4"/>
  <path d="M100 66h32M104 78h24" stroke="#4A3A2C" stroke-width="3"/>
  <circle cx="116" cy="42" r="5" fill="none" stroke="#5C5248" stroke-width="2.5"/>
  <path d="M116 47v20" stroke="#2A2724" stroke-width="1.5"/>

  <!-- Rails out of the portal, and the cart on them. -->
  <path d="M20 88h72" stroke="#3E3128" stroke-width="3"/>
  <g stroke="#2A2724" stroke-width="1.5"><path d="M24 84v6M34 84v6M44 84v6"/></g>
  <path d="M22 74h20v12H22Z" fill="#453E36"/>
  <path d="M22 74h20v2H22Z" fill="#5C5248"/>
  <path d="M24 76h16v5H24Z" fill="#2A2724"/>
  <g fill="#2A2724"><circle cx="27" cy="87" r="2.5"/><circle cx="37" cy="87" r="2.5"/></g>

  <!-- Spoil, tipped down the slope. -->
  <path d="M132 88c4-12 12-16 20-16l8 16Z" fill="#2E2922"/>

  <rect y="92" width="160" height="20" fill="#1A1815"/>
</svg>

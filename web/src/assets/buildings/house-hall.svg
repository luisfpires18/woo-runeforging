<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 112" role="img" aria-hidden="true">
  <!-- The House Hall: a long stone hall with a crenellated wing, on a dressed footing. -->
  <defs><linearGradient id="hhSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1A1815"/><stop offset="1" stop-color="#12100E"/></linearGradient></defs>
  <rect width="160" height="112" fill="url(#hhSky)"/>

  <!-- Ridge behind: a high saddle. This site sits under the pass itself. -->
  <path d="M0 44 22 24l18 14 26-20 24 18 20-12 30 22 20-10v66H0Z" fill="#221D19"/>
  <path d="M0 62 30 46l26 12 22-10 30 16 24-8 28 14v34H0Z" fill="#2A2521"/>

  <!-- Dressed footing and the steps up to the door. -->
  <path d="M14 86h132v6H14Z" fill="#312C26"/>
  <path d="M18 82h124v4H18Z" fill="#3E3831"/>
  <path d="M66 92h28v-4H66Z" fill="#453E36"/>
  <path d="M70 88h20v-4H70Z" fill="#4A4239"/>

  <!-- The hall. -->
  <path d="M26 50h84v32H26Z" fill="#3E3831"/>
  <path d="M26 50h84v4H26Z" fill="#4A4239"/>
  <path d="M22 50 68 32l46 18Z" fill="#2A2724"/>
  <path d="M22 50 68 32l4 2-44 18Z" fill="#39332C"/>
  <path d="M62 82V64a6 6 0 0 1 12 0v18Z" fill="#12100E"/>
  <path d="M62 64a6 6 0 0 1 12 0" fill="none" stroke="#4A4239" stroke-width="2"/>
  <g fill="#1A1815">
    <rect x="38" y="60" width="5" height="12"/><rect x="48" y="60" width="5" height="12"/>
    <rect x="86" y="60" width="5" height="12"/><rect x="96" y="60" width="5" height="12"/>
  </g>

  <!-- Crenellated wing. -->
  <path d="M110 58h30v24h-30Z" fill="#38322B"/>
  <path d="M110 58h30v4h-30Z" fill="#453E36"/>
  <g fill="#38322B"><rect x="110" y="50" width="7" height="8"/><rect x="122" y="50" width="7" height="8"/><rect x="134" y="50" width="6" height="8"/></g>
  <g fill="#4A4239"><rect x="110" y="50" width="7" height="2"/><rect x="122" y="50" width="7" height="2"/><rect x="134" y="50" width="6" height="2"/></g>
  <rect x="121" y="66" width="5" height="10" fill="#1A1815"/>

  <!-- House colours over the hall. One banner, no more. -->
  <path d="M32 46V22" stroke="#4A3A2C" stroke-width="2"/>
  <path d="M33 24h18l-5 6 5 6H33Z" fill="#8E2A24"/>

  <rect y="92" width="160" height="20" fill="#1A1815"/>
</svg>
